# Case-insensitive substrings. Replace these with the exact names reported by probe.sh.
real_name=AIR X Controller
virtual_name=Xbox Wireless Controller

# Present the awake hardware as the stock USB Xbox 360 identity (045e:028e).
xbox_proxy=true
proxy_name=Microsoft X-Box 360 pad
preserve_back_key=true

# Used by the original node-cycling mode when xbox_proxy=false.
cycle_real=true
settle_ms=250
poll_ms=500
state_dir=/sdcard/Download/AirXPadFix/state
